<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CanMatch</title>
<meta name="description" content="Snap any colour. Find the spray paint that matches it.">
<!-- Link preview (WhatsApp, Messages, Instagram, Facebook...) -->
<meta property="og:type" content="website">
<meta property="og:title" content="CanMatch">
<meta property="og:description" content="Snap any colour. Find the spray paint that matches it.">
<meta property="og:url" content="https://canmatch.github.io/CanMatch/">
<meta property="og:image" content="https://canmatch.github.io/CanMatch/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="CanMatch logo: a spray can with two matching reds">
<meta name="twitter:card" content="summary_large_image">
<!-- Browser tab and home-screen icons -->
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#161616">
<meta name="apple-mobile-web-app-title" content="CanMatch">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #E9E8E4; --surface: #F7F7F5; --ink: #161616; --muted: #5E5F61;
    --line: #C9C8C3; --focus: #1F6FB2; --ok: #1E7A44; --sample: #8E9092;
    color-scheme: light; box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1E1F20; --surface: #2A2B2D; --ink: #F1F0EC; --muted: #A6A7A9;
            --line: #3D3E41; --focus: #7EC3E8; --ok: #6FD39A; color-scheme: dark; }
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font-size: 16px; line-height: 1.45;
         font-family: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px 48px; }
  [hidden] { display: none !important; }

  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  h1 { font-stretch: 125%; font-weight: 900; font-size: 2.1rem; line-height: 1; letter-spacing: -0.01em; margin: 6px 0; }
  .tagline { margin: 4px 0 20px; color: var(--muted); }
  .icon-btns { display: flex; gap: 6px; }
  .icon-btn { font: inherit; font-size: 0.85rem; font-weight: 700; background: transparent; color: var(--ink);
              border: 2px solid var(--ink); border-radius: 999px; padding: 6px 12px; cursor: pointer; position: relative; }
  .badge { display: inline-block; min-width: 1.4em; padding: 0 5px; margin-left: 4px; border-radius: 999px;
           background: var(--ink); color: var(--bg); font-size: 0.75rem; text-align: center; }

  button.primary, label.primary, a.primary { font: inherit; font-weight: 700; border: 2px solid var(--ink); background: var(--ink);
    color: var(--bg); padding: 14px 18px; border-radius: 999px; cursor: pointer; display: inline-block; text-align: center; }
  button.secondary, label.secondary, a.secondary { font: inherit; font-weight: 700; border: 2px solid var(--ink); background: transparent;
    color: var(--ink); padding: 10px 16px; border-radius: 999px; cursor: pointer; display: inline-block; }
  button:focus-visible, label:focus-within, input:focus-visible, select:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  input[type=file] { position: absolute; opacity: 0; width: 1px; height: 1px; }

  .empty { border: 2px dashed var(--line); border-radius: 18px; padding: 40px 20px; text-align: center; background: var(--surface); }
  .empty p { color: var(--muted); margin: 14px 0 0; }

  .photo-wrap { border-radius: 18px; overflow: hidden; background: var(--surface); }
  canvas#photo { display: block; width: auto; height: auto; max-width: 100%; max-height: 58vh; margin: 0 auto;
                 touch-action: none; cursor: crosshair; -webkit-user-select: none; user-select: none; }
  #loupe { position: fixed; z-index: 40; width: 120px; height: 120px; border-radius: 50%; overflow: hidden;
           border: 4px solid #FFFFFF; box-shadow: 0 0 0 2px #000000, 0 6px 18px rgba(0,0,0,0.35); pointer-events: none; }
  #loupe canvas { width: 100%; height: 100%; display: block; }
  .hint { color: var(--muted); font-size: 0.9rem; margin: 8px 2px 0; }
  .light-card { background: var(--surface); border-radius: 14px; padding: 12px 14px; margin-top: 12px; }
  .light-card p { margin: 4px 0 0; color: var(--muted); font-size: 0.9rem; }
  button.small { padding: 9px 14px; font-size: 0.9rem; }
  .instruction { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; padding: 12px 14px;
                 border-radius: 14px; background: var(--surface); font-size: 1.05rem; font-weight: 700; line-height: 1.3; }
  .instruction::before { content: "👆"; font-size: 1.4rem; }
  .instruction.active { background: var(--ink); color: var(--bg); }
  .instruction.active::before { content: "⬜"; }
  .instruction.ok { color: var(--ok); }
  .instruction.ok::before { content: "✓"; font-weight: 900; }
  .hint.active { color: var(--ink); font-weight: 700; }
  .hint.ok { color: var(--ok); font-weight: 700; }
  .row-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

  .sample { margin-top: 22px; border-radius: 18px; background: var(--sample); min-height: 150px; padding: 18px;
            display: flex; flex-direction: column; justify-content: flex-end; transition: background-color 0.25s ease; }
  .sample .hex { font-stretch: 125%; font-weight: 900; font-size: 2rem; line-height: 1; }
  .sample .sub { font-size: 0.9rem; opacity: 0.85; }
  .sample.light-text { color: #FFFFFF; } .sample.dark-text { color: #161616; }

  h2 { font-stretch: 110%; font-weight: 800; font-size: 1.2rem; margin: 26px 0 10px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { font: inherit; font-size: 0.9rem; font-weight: 600; padding: 7px 14px; border-radius: 999px;
          border: 2px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .toggle { display: flex; gap: 10px; align-items: center; margin-top: 14px; font-size: 0.9rem; color: var(--muted); }
  .toggle input { width: 20px; height: 20px; accent-color: var(--ink); }

  ol.matches { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 10px; }
  .match { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center;
           background: var(--surface); border-radius: 14px; padding: 10px; }
  .pair { display: flex; height: 56px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
  .pair span { flex: 1; }
  .pair-cap { display: flex; font-size: 0.68rem; color: var(--muted); margin-top: 3px; }
  .pair-cap span { flex: 1; text-align: center; }
  .cart .list-item .pair { height: 52px; }
  .match .name { font-weight: 700; }
  .match .meta { color: var(--muted); font-size: 0.85rem; }
  .score { text-align: right; font-size: 0.8rem; }
  .score b { display: block; font-size: 1.25rem; font-stretch: 110%; }
  .add { grid-column: 2 / 4; justify-self: start; font: inherit; font-size: 0.85rem; font-weight: 700;
         border: 2px solid var(--ink); background: transparent; color: var(--ink); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
  .add[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .note { color: var(--muted); font-size: 0.85rem; margin-top: 18px; }

  /* Sheets: onboarding, tips, shopping list */
  .sheet { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto;
           padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px)); }
  .sheet-inner { max-width: 560px; margin: 0 auto; }
  .sheet h2 { font-size: 1.6rem; margin-top: 12px; }
  .step-count { color: var(--muted); font-size: 0.85rem; margin: 8px 0 0; }
  .lang-list { display: grid; gap: 10px; margin-top: 18px; }
  .lang-btn { font: inherit; font-size: 1.15rem; font-weight: 700; text-align: left; padding: 16px 18px; border-radius: 14px;
              border: 2px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
  .lang-btn[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  label.field { display: block; margin-top: 16px; font-weight: 700; }
  label.field select, label.field input { display: block; width: 100%; margin-top: 6px; font: inherit; font-weight: 400;
    padding: 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); }
  .sheet-actions { display: flex; gap: 10px; margin-top: 26px; flex-wrap: wrap; }
  .tips { padding-left: 1.2em; margin: 16px 0 0; } .tips li { margin-bottom: 12px; }

  .list-group h3 { font-size: 1rem; margin: 22px 0 8px; }
  .list-item { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center;
               background: var(--surface); border-radius: 12px; padding: 8px 10px; margin-bottom: 8px; }
  .list-item .sw { height: 44px; border-radius: 8px; border: 1px solid var(--line); }
  .qty { display: flex; align-items: center; gap: 6px; }
  .qty button { font: inherit; font-weight: 800; width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--ink);
                background: transparent; color: var(--ink); cursor: pointer; }
  .targets { display: flex; gap: 4px; margin-top: 4px; }
  .targets span { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--line); }

  .sub-h { font-size: 1.1rem; margin: 22px 0 0; }
  .shop { background: var(--surface); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
  .shop .shop-name { font-weight: 800; }
  .shop .shop-meta { color: var(--muted); font-size: 0.85rem; }
  .shop .bar { height: 6px; border-radius: 3px; background: var(--line); margin: 8px 0; overflow: hidden; }
  .shop .bar span { display: block; height: 100%; background: var(--ink); }
  .shop-links { display: flex; gap: 12px; flex-wrap: wrap; font-size: 0.9rem; font-weight: 700; }
  .shop-links a { color: var(--ink); }
  .where { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
  .cart .list-item { grid-template-columns: 64px 1fr auto; }
  .cart .list-item .sw { height: 52px; }
  .remove { font: inherit; font-size: 0.8rem; color: var(--muted); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
  .shop-opt { display: grid; grid-template-columns: 24px 1fr; gap: 12px; align-items: start; background: var(--surface);
              border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; cursor: pointer; }
  .shop-opt:has(input:checked) { border-color: var(--ink); }
  .shop-opt .shop-meta { color: var(--muted); font-size: 0.85rem; margin-top: 2px; }
  #coTotals .order-line { padding: 6px 0; }
  .shop-opt input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--ink); }
  .stock-ok { color: var(--ok); font-weight: 700; font-size: 0.85rem; }
  .stock-part { color: var(--muted); font-weight: 700; font-size: 0.85rem; }
  .unavail { opacity: 0.45; }
  .unavail-tag { font-size: 0.75rem; font-weight: 700; color: var(--muted); }
  .shop-group { margin-bottom: 26px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
  .shop-group .cart-total { margin: 12px 0 10px; }
  .cart-bar { position: sticky; bottom: 0; background: var(--bg); padding: 14px 0 6px; margin-top: 12px;
              border-top: 1px solid var(--line); }
  .cart-total { font-weight: 700; margin-bottom: 10px; }
  .cart-total small { display: block; font-weight: 400; color: var(--muted); }
  .buy { width: 100%; font-size: 1.05rem; }
  .buy:disabled { opacity: 0.4; cursor: not-allowed; }
  .cart-actions { display: flex; gap: 18px; justify-content: center; margin-top: 10px; }
  .link-btn { font: inherit; font-size: 0.9rem; font-weight: 700; color: var(--ink); background: none; border: 0; text-decoration: underline; cursor: pointer; padding: 4px; }
  .order-check { width: 64px; height: 64px; border-radius: 50%; background: var(--ink); color: var(--bg);
                 display: grid; place-items: center; font-size: 2rem; font-weight: 900; margin-top: 24px; }
  .demo-note { background: var(--surface); border-left: 4px solid var(--ink); padding: 10px 12px; border-radius: 6px; font-size: 0.9rem; }
  .order-line { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .buy-from { background: var(--surface); border-radius: 14px; padding: 12px 14px; margin-bottom: 14px; }
  .buy-from b { font-size: 1.05rem; }
  .price-col { text-align: right; min-width: 92px; }
  .price-col .line { font-weight: 800; }
  .price-col .unit { font-size: 0.8rem; color: var(--muted); }
  .price-tag { font-size: 0.85rem; font-weight: 700; margin-top: 2px; }
  .price-tag.na { color: var(--muted); font-weight: 600; }
  .total-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 1.15rem; }
  .total-row b { font-size: 1.4rem; font-stretch: 110%; }
  .cart .list-item { grid-template-columns: 64px 1fr auto; }
  .cart .qty-wrap { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  main { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
  h1 { margin-top: 10px; }
  .sample .hex { font-size: 1.6rem; }
  .sample .sub { font-size: 0.8rem; opacity: 0.75; letter-spacing: 0.02em; }
  .results-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 22px; }
  .results-head h2 { margin: 0; }
  .filter-btn { padding: 8px 14px; font-size: 0.9rem; white-space: nowrap; }
  .filter-panel { background: var(--surface); border-radius: 14px; padding: 4px 14px 14px; margin-top: 12px; }
  .filter-panel .sub-h { margin-top: 14px; }
  .near-toggle { color: var(--ink); font-weight: 700; margin-top: 10px; }
  .show-more { width: 100%; margin-top: 12px; }
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; display: grid; grid-template-columns: repeat(3, 1fr);
            background: var(--surface); border-top: 1px solid var(--line);
            padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); }
  .tab { font: inherit; font-size: 0.8rem; font-weight: 700; background: none; border: 0; color: var(--muted);
         display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; cursor: pointer; }
  .tab[aria-current="page"] { color: var(--ink); }
  .tab-ico { font-size: 1.35rem; line-height: 1; position: relative; }
  .tab .badge { position: absolute; top: -6px; right: -14px; font-size: 0.7rem; }
  .sheet { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
  #setup, #orderSheet { z-index: 30; padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
    ol.how { list-style: none; padding: 0; margin: 16px 0 0; display: grid; gap: 14px; }
  .how-step { display: grid; grid-template-columns: 120px 1fr; gap: 14px; align-items: center;
              background: var(--surface); border-radius: 16px; padding: 12px; }
  .how-art svg { width: 100%; height: auto; display: block; border-radius: 10px; }
  .how-num { width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: var(--bg);
             display: grid; place-items: center; font-weight: 800; font-size: 0.85rem; }
  .how-step h3 { margin: 6px 0 2px; font-size: 1.02rem; }
  .how-step p { margin: 0; color: var(--muted); font-size: 0.9rem; }
  @media (prefers-reduced-motion: reduce) { .sample { transition: none; } }
</style>
</head>
<body>
<main id="app">
  <h1>CanMatch</h1>
  <p class="tagline" data-i18n="tagline"></p>

  <section id="empty" class="empty">
    <label class="primary"><span data-i18n="takePhoto"></span><input id="file" type="file" accept="image/*"></label>
    <p data-i18n="shootHint"></p>
  </section>

  <section id="viewer" hidden>
    <p class="instruction" id="hint" aria-live="polite"></p>
    <div class="photo-wrap"><canvas id="photo"></canvas></div>
    <div id="loupe" aria-hidden="true" hidden><canvas id="loupeCanvas" width="240" height="240"></canvas></div>
    <div class="light-card" id="lightCard">
      <div>
        <b data-i18n="lightQ"></b>
        <p data-i18n="lightHow"></p>
      </div>
      <div class="row-actions" style="margin-top:8px">
        <button type="button" class="primary small" id="fixLight" data-i18n="fixLight"></button>
        <button type="button" class="secondary small" id="cancelLight" data-i18n="cancel" hidden></button>
        <button type="button" class="secondary small" id="resetLight" data-i18n="resetLight" hidden></button>
      </div>
    </div>
    <div class="row-actions">
      <label class="secondary"><span data-i18n="newPhoto"></span><input id="file2" type="file" accept="image/*"></label>
    </div>
  </section>

  <section id="results" hidden>
    <div id="sample" class="sample" aria-live="polite">
      <div class="hex" data-i18n="yourColour"></div>
      <div class="sub" id="sampleHex">#000000</div>
    </div>
    <div class="results-head">
      <h2 data-i18n="closest"></h2>
      <button type="button" class="secondary filter-btn" id="filterBtn" aria-expanded="false" aria-controls="filterPanel"></button>
    </div>
    <p class="note" id="nearNote" hidden></p>
    <div id="filterPanel" class="filter-panel" hidden>
    <div id="sprayFilters">
    <h3 class="sub-h" data-i18n="pressure"></h3>
    <div class="chips" id="pressureChips">
      <button type="button" class="chip" data-p="all" aria-pressed="true" data-i18n="all"></button>
      <button type="button" class="chip" data-p="low" aria-pressed="false" data-i18n="low"></button>
      <button type="button" class="chip" data-p="high" aria-pressed="false" data-i18n="high"></button>
    </div>
    <h3 class="sub-h" data-i18n="brands"></h3>
    <div class="chips" id="brandChips"></div>
    <label class="toggle"><input type="checkbox" id="specialToggle"> <span data-i18n="includeSpecial"></span></label>
    <label class="toggle"><input type="checkbox" id="hardwareToggle"> <span data-i18n="includeHardware"></span></label>
    </div>
    </div>
    <ol class="matches" id="matchList"></ol>
    <button type="button" class="secondary show-more" id="showMore" hidden></button>
    <p class="note" data-i18n="note"></p>
  </section>
</main>

<nav class="tabbar" aria-label="CanMatch">
  <button type="button" class="tab" id="tabMatch" aria-current="page"><span class="tab-ico" aria-hidden="true">◎</span><span data-i18n="tabMatch"></span></button>
  <button type="button" class="tab" id="openList"><span class="tab-ico" aria-hidden="true">🛒<span class="badge" id="listCount">0</span></span><span data-i18n="list"></span></button>
  <button type="button" class="tab" id="openSettings"><span class="tab-ico" aria-hidden="true">⚙</span><span data-i18n="settings"></span></button>
</nav>

<!-- Setup: language and city, then how it works + tips -->
<div class="sheet" id="setup" role="dialog" aria-modal="true" aria-labelledby="setupTitle">
  <div class="sheet-inner">
    <div id="stepStart">
      <p class="step-count" data-i18n="step1"></p>
      <h2 id="setupTitle" data-i18n="startTitle"></h2>
      <div class="lang-list" role="group" aria-label="Language · Γλώσσα · Langue">
        <button type="button" class="lang-btn" data-lang="en">English</button>
        <button type="button" class="lang-btn" data-lang="el">Ελληνικά</button>
        <button type="button" class="lang-btn" data-lang="fr">Français</button>
      </div>
      <label class="field"><span data-i18n="cityLabel"></span><select id="citySelect"></select></label>
      <label class="field" id="otherCityField" hidden><span data-i18n="otherCity"></span><input id="otherCity" type="text" autocomplete="address-level2"></label>
      <p class="tagline" style="margin-top:10px" data-i18n="locationWhy"></p>
      <div class="sheet-actions"><button type="button" class="primary" id="startNext" data-i18n="continue"></button></div>
    </div>
    <div id="stepAbout" hidden>
      <p class="step-count" data-i18n="step2"></p>
      <h2 data-i18n="howTitle"></h2>
      <ol class="how">
        <li class="how-step"><div class="how-art"><svg viewBox="0 0 160 110" aria-hidden="true"><rect x="8" y="10" width="144" height="90" rx="10" fill="#E9DFC0"/><rect x="80" y="10" width="72" height="90" fill="#C8463A"/><rect x="52" y="22" width="56" height="78" rx="10" fill="var(--ink)"/><rect x="57" y="30" width="46" height="52" rx="4" fill="#C8463A"/><rect x="57" y="30" width="20" height="52" fill="#E9DFC0"/><circle cx="80" cy="91" r="5" fill="var(--bg)"/></svg></div>
          <div><div class="how-num">1</div><h3 data-i18n="s1t"></h3><p data-i18n="s1d"></p></div></li>

/* ---------- Colour maths ---------- */

function hexToRgb(hex) {
  const h = hex.replace('#', '');
  return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
}
function rgbToHex(r, g, b) {
  return '#' + [r, g, b].map(v => Math.round(v).toString(16).padStart(2, '0')).join('').toUpperCase();
}
// sRGB (0-255) -> CIE Lab (D65)
function rgbToLab(r, g, b) {
  const lin = c => { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
  const R = lin(r), G = lin(g), B = lin(b);
  const X = (0.4124564 * R + 0.3575761 * G + 0.1804375 * B) / 0.95047;
  const Y = (0.2126729 * R + 0.7151522 * G + 0.0721750 * B) / 1.0;
  const Z = (0.0193339 * R + 0.1191920 * G + 0.9503041 * B) / 1.08883;
  const f = t => t > 216 / 24389 ? Math.cbrt(t) : (24389 / 27 * t + 16) / 116;
  const fx = f(X), fy = f(Y), fz = f(Z);
  return [116 * fy - 16, 500 * (fx - fy), 200 * (fy - fz)];
}
// CIEDE2000 colour difference
function deltaE2000(lab1, lab2) {
  const [L1, a1, b1] = lab1, [L2, a2, b2] = lab2;
  const rad = Math.PI / 180, deg = 180 / Math.PI;
  const C1 = Math.hypot(a1, b1), C2 = Math.hypot(a2, b2);
  const Cbar = (C1 + C2) / 2;
  const G = 0.5 * (1 - Math.sqrt(Math.pow(Cbar, 7) / (Math.pow(Cbar, 7) + Math.pow(25, 7))));
  const a1p = (1 + G) * a1, a2p = (1 + G) * a2;
  const C1p = Math.hypot(a1p, b1), C2p = Math.hypot(a2p, b2);
  const hp = (b, a) => { if (b === 0 && a === 0) return 0; const h = Math.atan2(b, a) * deg; return h < 0 ? h + 360 : h; };
  const h1p = hp(b1, a1p), h2p = hp(b2, a2p);
  const dLp = L2 - L1, dCp = C2p - C1p;
  let dhp = 0;
  if (C1p * C2p !== 0) {
    dhp = h2p - h1p;
    if (dhp > 180) dhp -= 360; else if (dhp < -180) dhp += 360;
  }
  const dHp = 2 * Math.sqrt(C1p * C2p) * Math.sin(dhp * rad / 2);
  const Lbp = (L1 + L2) / 2, Cbp = (C1p + C2p) / 2;
  let hbp = h1p + h2p;
  if (C1p * C2p !== 0) {
    if (Math.abs(h1p - h2p) > 180) hbp += (hbp < 360 ? 360 : -360);
    hbp /= 2;
  }
  const T = 1 - 0.17 * Math.cos((hbp - 30) * rad) + 0.24 * Math.cos(2 * hbp * rad)
          + 0.32 * Math.cos((3 * hbp + 6) * rad) - 0.20 * Math.cos((4 * hbp - 63) * rad);
  const dTheta = 30 * Math.exp(-Math.pow((hbp - 275) / 25, 2));
  const Rc = 2 * Math.sqrt(Math.pow(Cbp, 7) / (Math.pow(Cbp, 7) + Math.pow(25, 7)));
  const Sl = 1 + (0.015 * Math.pow(Lbp - 50, 2)) / Math.sqrt(20 + Math.pow(Lbp - 50, 2));
  const Sc = 1 + 0.045 * Cbp, Sh = 1 + 0.015 * Cbp * T;
  const Rt = -Math.sin(2 * dTheta * rad) * Rc;
  return Math.sqrt(Math.pow(dLp / Sl, 2) + Math.pow(dCp / Sc, 2) + Math.pow(dHp / Sh, 2)
                   + Rt * (dCp / Sc) * (dHp / Sh));
}

function canvasPoint(e) {

  const y = Math.min(canvas.height - 1, Math.max(0, (e.clientY - rect.top) * (canvas.height / rect.height)));

}
function showLoupe(e, pt) {
  const L = 240, viewCss = 40;                 // the loupe shows a 40-screen-pixel area, 3x enlarged
  const sw = viewCss * pt.k;
  lctx.imageSmoothingEnabled = false;
  lctx.fillStyle = '#808080'; lctx.fillRect(0, 0, L, L);
  lctx.drawImage(srcCanvas, pt.x - sw / 2, pt.y - sw / 2, sw, sw, 0, 0, L, L);

  lctx.lineWidth = 4; lctx.strokeStyle = '#000000'; lctx.beginPath(); lctx.arc(L / 2, L / 2, rr + 3, 0, Math.PI * 2); lctx.stroke();
  lctx.lineWidth = 3; lctx.strokeStyle = '#FFFFFF'; lctx.beginPath(); lctx.arc(L / 2, L / 2, rr, 0, Math.PI * 2); lctx.stroke();

    coMethod === 'delivery' ? `${t('deliveryAddr')}: ${store.account.address}` : ''].filter(Boolean).join(' · ');
  body.appendChild(note);
  const tn = document.createElement('p'); tn.className = 'note'; tn.textContent = t('testNotice').replace('{shop}', shop.name); body.appendChild(tn);
  const links = $('orderLinks'); links.innerHTML = '';
  const sh = document.createElement('button'); sh.type = 'button'; sh.className = 'secondary'; sh.textContent = t('shareOrder');
  sh.addEventListener('click', () => shareText(orderText(shop), t('orderHeader'))); links.appendChild(sh);
  $('checkoutView').hidden = true; $('doneView').hidden = false; $('orderSheet').scrollTop = 0;
});
$('orderClose').addEventListener('click', () => { $('orderSheet').hidden = true; });
function setTab(id) {
  ['tabMatch', 'openList', 'openSettings'].forEach(x => { if (x === id) $(x).setAttribute('aria-current', 'page'); else $(x).removeAttribute('aria-current'); });
}
function goMatch() {
  $('listSheet').hidden = true; $('settingsSheet').hidden = true; setTab('tabMatch');
  if (lastSample) showResults(); renderListCount();
}
$('tabMatch').addEventListener('click', goMatch);
$('openList').addEventListener('click', () => { $('settingsSheet').hidden = true; renderList(); $('listSheet').hidden = false; setTab('openList'); });
$('closeList').addEventListener('click', goMatch);
$('clearList').addEventListener('click', () => { store.list = []; save(); renderList(); renderListCount(); });
$('shareList').addEventListener('click', () => shareText(listText(), t('listHeader'), $('listMsg')));

/* ---------- Settings (no walkthrough) ---------- */
function fillCitySelect(sel, value) {
  sel.innerHTML = '<option value="">—</option>' + CITIES.map(c => `<option value="${c.key}">${c[lang] || c.en}</option>`).join('');
  sel.value = value || '';
}
function renderSettings() {
  document.querySelectorAll('.set-lang').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang ? 'true' : 'false'));
  fillCitySelect($('setCity'), store.city);
  $('setOtherField').hidden = store.city !== 'other'; $('setOther').value = store.cityOther || '';
  $('setOther').placeholder = t('otherCityPh');
  const shops = cityShops();
  $('setShop').textContent = shops.length ? t('yourShops').replace('{shops}', shops.map(x => x.name).join(', ')) : (store.city ? t('noShopSet') : '');
  const a = store.account || {};
  $('accName').value = a.name || ''; $('accEmail').value = a.email || ''; $('accPhone').value = a.phone || '';
}
$('openSettings').addEventListener('click', () => { $('listSheet').hidden = true; renderSettings(); $('setMsg').textContent = ''; $('settingsSheet').hidden = false; setTab('openSettings'); });
$('closeSettings').addEventListener('click', goMatch);
document.querySelectorAll('.set-lang').forEach(b => b.addEventListener('click', () => {
  lang = b.dataset.lang; store.lang = lang; save(); applyLang(); renderSettings();
}));
$('setCity').addEventListener('change', e => {
  store.city = e.target.value; if (store.city !== 'other') store.cityOther = '';
  save(); renderSettings();
});
$('setOther').addEventListener('input', e => { store.cityOther = e.target.value.trim(); save(); });
['accName', 'accEmail', 'accPhone'].forEach(id => $(id).addEventListener('input', () => {
  store.account = { name: $('accName').value.trim(), email: $('accEmail').value.trim(), phone: $('accPhone').value.trim() };
  save(); $('setMsg').textContent = t('saved');
}));
$('setEmpty').addEventListener('click', () => { store.list = []; save(); renderListCount(); $('setMsg').textContent = t('cartEmptied'); });
$('setAbout').addEventListener('click', () => { showStep('stepAbout'); });

/* ---------- Start ---------- */
applyLang();
if (!store.setupDone) showStep('stepStart'); else $('setup').hidden = true;
</script>
</body>
</html>
