<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kromatch</title>
<meta name="description" content="Plan your piece and get every spray can you need from a shop near you. Upload a mural or graffiti design, or match any single colour from a photo.">
<!-- Link preview (WhatsApp, Messages, Instagram, Facebook...) -->
<meta property="og:type" content="website">
<meta property="og:title" content="Kromatch">
<meta property="og:description" content="Upload your sketch and get every spray can you need. Order online or pick up at a shop near you.">
<meta property="og:url" content="https://kromatch.com/">
<meta property="og:image" content="https://kromatch.com/og-image.png?v=8">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Kromatch: match every colour, get every can">
<meta name="twitter:card" content="summary_large_image">
<!-- Browser tab and home-screen icons -->
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#161616">
<meta name="apple-mobile-web-app-title" content="Kromatch">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #E9E8E4; --surface: #F7F7F5; --ink: #161616; --muted: #5E5F61;
    --line: #C9C8C3; --focus: #1F6FB2; --ok: #1E7A44; --sample: #8E9092;
    color-scheme: light; box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1E1F20; --surface: #2A2B2D; --ink: #F1F0EC; --muted: #A6A7A9;
            --line: #3D3E41; --focus: #7EC3E8; --ok: #6FD39A; color-scheme: dark; }
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font-size: 16px; line-height: 1.45;
         font-family: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px 48px; }
  [hidden] { display: none !important; }

  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  h1 { font-stretch: 125%; font-weight: 900; font-size: 2.1rem; line-height: 1; letter-spacing: -0.01em; margin: 6px 0; }
  /* the name as a logo: written "Kromatch" (so screen readers say it right), shown in caps */
  .wordmark { text-transform: uppercase; letter-spacing: -0.005em; }
  .tagline { margin: 4px 0 20px; color: var(--muted); }
  /* Home: a bigger name, a tagline with character, and one line on what Kromatch is for */
  :root { --font-display: "Archivo", system-ui, sans-serif; --font-accent: "Archivo", system-ui, sans-serif; }
  .hero { margin: 8px 0 18px; }
  .home-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 0 0 10px; }
  .top-chip { font: inherit; font-size: 0.88rem; font-weight: 700; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
              border-radius: 999px; padding: 6px 12px; min-height: 36px; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
  .lang-chip select { font: inherit; font-weight: 700; color: var(--ink); background: transparent; border: 0; padding: 0 2px; cursor: pointer; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  /* Home keeps it simple: no city or shop menus here (they're on the Design screen, next to the cans) */
  main#app:has(> #empty:not([hidden])) > #locBlock { display: none !important; }
  /* phones: the three pictures already explain, so the card is just the title and the button */
  @media (max-width: 640px) { .home-card [data-i18n="homeDesignDesc"] { display: none; } .home-card h2 { margin-bottom: 12px; } }
  .hero .wordmark { font-family: var(--font-display); font-size: clamp(2.7rem, 11vw, 3.4rem); margin: 4px 0 6px; }
  .hero .tagline { font-family: var(--font-accent); color: var(--ink); font-size: 1.2rem; font-weight: 800; line-height: 1.22; margin: 0 0 10px; white-space: pre-line; }
  .hero-line { margin: 0; font-size: 1.02rem; color: var(--ink); opacity: 0.82; max-width: 34em; }
  .how { list-style: none; counter-reset: how; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 6px 0 0; padding: 0; }
  .how li { counter-increment: how; display: flex; flex-direction: column; gap: 6px; font-size: 0.82rem; font-weight: 700; line-height: 1.25; }
  .how li span::before { content: counter(how) ". "; }
  .how-pic { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px; color: var(--ink); position: relative; }
  .how-pic svg { display: block; width: 100%; height: auto; }
  .how li:not(:last-child) .how-pic::after { content: '→'; position: absolute; right: -12px; top: 50%; transform: translateY(-50%);
    font-weight: 900; font-size: 1rem; color: var(--ink); background: var(--bg); border-radius: 50%; width: 16px; text-align: center; line-height: 16px; z-index: 1; }
  @media (min-width: 960px) { .how { gap: 18px; margin-top: 24px; } .how li { font-size: 0.95rem; } .how li:not(:last-child) .how-pic::after { right: -16px; } }
  .home-card h2 { font-family: var(--font-display); }
  .home-ico { color: var(--ink); }
  .one-ico { display: inline-flex; color: var(--ink); }
  /* wide screens: name and explanation on the left, the upload card on the right */
  @media (min-width: 960px) {
    main#app:has(> #empty:not([hidden])) { max-width: 1120px; display: grid; grid-template-columns: minmax(0, 1fr) 480px;
      column-gap: 64px; align-items: start; padding-top: max(56px, 12vh); }
    main#app:has(> #empty:not([hidden])) > * { grid-column: 1 / -1; }
    main#app:has(> #empty:not([hidden])) > .hero { grid-column: 1; grid-row: 1 / span 3; }
    main#app:has(> #empty:not([hidden])) > #locSlotHome { grid-column: 2; grid-row: 1; }
    main#app:has(> #empty:not([hidden])) > #locBlock { grid-column: 2; grid-row: 1; margin-top: 18px; }
    main#app:has(> #empty:not([hidden])) > #empty { grid-column: 2; grid-row: 2; align-self: start; }
    main#app:has(> #empty:not([hidden])) .loc-bar { margin-top: 0; }
    .hero .wordmark { font-size: clamp(3.4rem, 5vw, 4.4rem); }
    .hero .tagline { font-size: 1.9rem; }
    .hero-line { font-size: 1.15rem; }
  }
  .icon-btns { display: flex; gap: 6px; }
  .icon-btn { font: inherit; font-size: 0.85rem; font-weight: 700; background: transparent; color: var(--ink);
              border: 2px solid var(--ink); border-radius: 999px; padding: 6px 12px; cursor: pointer; position: relative; }
  .badge { display: inline-block; min-width: 1.4em; padding: 0 5px; margin-left: 4px; border-radius: 999px;
           background: var(--ink); color: var(--bg); font-size: 0.75rem; text-align: center; }

  button.primary, label.primary, a.primary { font: inherit; font-weight: 700; border: 2px solid var(--ink); background: var(--ink);
    color: var(--bg); padding: 14px 18px; border-radius: 999px; cursor: pointer; display: inline-block; text-align: center; }
  button.secondary, label.secondary, a.secondary { font: inherit; font-weight: 700; border: 2px solid var(--ink); background: transparent;
    color: var(--ink); padding: 10px 16px; border-radius: 999px; cursor: pointer; display: inline-block; }
  button:focus-visible, label:focus-within, input:focus-visible, select:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  input[type=file] { position: absolute; opacity: 0; width: 1px; height: 1px; }

  .loc-bar { display: flex; align-items: center; gap: 8px; margin: -8px 0 14px; font-weight: 700; font-size: 0.95rem; }
  .loc-bar .link-btn { margin-left: auto; }
  .shop-pick { display: flex; align-items: center; gap: 8px; margin: -6px 0 14px; font-size: 0.9rem; font-weight: 700; }
  .shop-pick select { flex: 1; font: inherit; font-weight: 400; padding: 8px 10px; border-radius: 10px; border: 2px solid var(--line);
                      background: var(--surface); color: var(--ink); min-width: 0; }
  .loc-suggest { background: var(--ink); color: var(--bg); border-radius: 14px; padding: 12px 14px; margin-bottom: 14px; font-weight: 700; }
  .loc-suggest .secondary { color: var(--bg); border-color: var(--bg); }
  .loc-suggest .primary { background: var(--bg); color: var(--ink); border-color: var(--bg); }
  .home-cards { display: grid; gap: 14px; }
  .home-card { background: var(--surface); border-radius: 18px; padding: 18px; border: 1px solid var(--line); }
  .home-card h2 { margin: 6px 0 4px; font-size: 1.3rem; }
  .home-card p { margin: 0 0 14px; }
  .home-card .note { margin: 10px 0 0; }
  .home-card label.primary { width: 100%; }
  .home-one { display: flex; align-items: center; gap: 10px; padding: 4px 18px; color: var(--ink); font-size: 1rem; }
  .home-one .one-link { position: relative; padding: 4px 2px; font-size: 0.95rem; }
  .home-ico { line-height: 1; }
  .design-prompt { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--surface);
                   border-radius: 14px; padding: 12px 14px; margin-top: 16px; }
  .design-prompt b { font-size: 0.95rem; }
  .empty { border: 2px dashed var(--line); border-radius: 18px; padding: 40px 20px; text-align: center; background: var(--surface); }
  .empty p { color: var(--muted); margin: 14px 0 0; }

  .photo-wrap { border-radius: 18px; overflow: hidden; background: var(--surface); }
  canvas#photo { display: block; width: auto; height: auto; max-width: 100%; max-height: 58vh; margin: 0 auto;
                 touch-action: none; cursor: crosshair; -webkit-user-select: none; user-select: none; }
  #loupe { position: fixed; z-index: 40; width: 120px; height: 120px; border-radius: 50%; overflow: hidden;
           border: 4px solid #FFFFFF; box-shadow: 0 0 0 2px #000000, 0 6px 18px rgba(0,0,0,0.35); pointer-events: none; }
  #loupe canvas { width: 100%; height: 100%; display: block; }
  .hint { color: var(--muted); font-size: 0.9rem; margin: 8px 2px 0; }
  .light-card { background: var(--surface); border-radius: 14px; padding: 10px 14px; margin-top: 12px; }
  .light-card summary { font-weight: 700; cursor: pointer; font-size: 0.95rem; }
  .light-card p { margin: 4px 0 0; color: var(--muted); font-size: 0.9rem; }
  button.small { padding: 9px 14px; font-size: 0.9rem; }
  .instruction { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; padding: 12px 14px;
                 border-radius: 14px; background: var(--surface); font-size: 1.05rem; font-weight: 700; line-height: 1.3; }
  .instruction::before { content: "👆"; font-size: 1.4rem; }
  .instruction.active { background: var(--ink); color: var(--bg); }
  .instruction.active::before { content: "⬜"; }
  .instruction.ok { color: var(--ok); }
  .instruction.ok::before { content: "✓"; font-weight: 900; }
  .hint.active { color: var(--ink); font-weight: 700; }
  .hint.ok { color: var(--ok); font-weight: 700; }
  .row-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

  .sample { margin-top: 22px; border-radius: 18px; background: var(--sample); min-height: 150px; padding: 18px;
            display: flex; flex-direction: column; justify-content: flex-end; transition: background-color 0.25s ease; }
  .sample .hex { font-stretch: 125%; font-weight: 900; font-size: 2rem; line-height: 1; }
  .sample .sub { font-size: 0.9rem; opacity: 0.85; }
  .sample.light-text { color: #FFFFFF; } .sample.dark-text { color: #161616; }

  h2 { font-stretch: 110%; font-weight: 800; font-size: 1.2rem; margin: 26px 0 10px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { font: inherit; font-size: 0.9rem; font-weight: 600; padding: 7px 14px; border-radius: 999px;
          border: 2px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .toggle { display: flex; gap: 10px; align-items: center; margin-top: 14px; font-size: 0.9rem; color: var(--muted); }
  .toggle input { width: 20px; height: 20px; accent-color: var(--ink); }

  ol.matches { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 10px; }
  .match { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center;
           background: var(--surface); border-radius: 14px; padding: 10px; }
  .pair { display: flex; height: 56px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
  .pair span { flex: 1; }
  .pair-cap { display: flex; font-size: 0.68rem; color: var(--muted); margin-top: 3px; }
  .pair-cap span { flex: 1; text-align: center; }
  .cart .list-item .pair { height: 52px; }
  .match .name { font-weight: 700; }
  .match .meta { color: var(--muted); font-size: 0.85rem; }
  .score { text-align: right; font-size: 0.8rem; }
  .score b { display: block; font-size: 1.25rem; font-stretch: 110%; }
  .add { grid-column: 2 / 4; justify-self: start; font: inherit; font-size: 0.85rem; font-weight: 700;
         border: 2px solid var(--ink); background: transparent; color: var(--ink); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
  .add[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .details-btn { font: inherit; font-size: 0.8rem; color: var(--muted); background: none; border: 0; padding: 2px 0;
                 text-decoration: underline; cursor: pointer; }
  .note { color: var(--muted); font-size: 0.85rem; margin-top: 18px; }

  /* Sheets: onboarding, tips, shopping list */
  .sheet { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto;
           padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px)); }
  .sheet-inner { max-width: 560px; margin: 0 auto; }
  .sheet h2 { font-size: 1.6rem; margin-top: 12px; }
  .step-count { color: var(--muted); font-size: 0.85rem; margin: 8px 0 0; }
  .lang-list { display: grid; gap: 10px; margin-top: 18px; }
  .lang-btn { font: inherit; font-size: 1.15rem; font-weight: 700; text-align: left; padding: 16px 18px; border-radius: 14px;
              border: 2px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
  .lang-btn[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  label.field { display: block; margin-top: 16px; font-weight: 700; }
  label.field select, label.field input { display: block; width: 100%; margin-top: 6px; font: inherit; font-weight: 400;
    padding: 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); }
  .sheet-actions { display: flex; gap: 10px; margin-top: 26px; flex-wrap: wrap; }
  .tips { padding-left: 1.2em; margin: 16px 0 0; } .tips li { margin-bottom: 12px; }

  .list-group h3 { font-size: 1rem; margin: 22px 0 8px; }
  .list-item { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center;
               background: var(--surface); border-radius: 12px; padding: 8px 10px; margin-bottom: 8px; }
  .list-item .sw { height: 44px; border-radius: 8px; border: 1px solid var(--line); }
  .qty { display: flex; align-items: center; gap: 6px; }
  .qty button { font: inherit; font-weight: 800; width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--ink);
                background: transparent; color: var(--ink); cursor: pointer; }
  .targets { display: flex; gap: 4px; margin-top: 4px; }
  .targets span { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--line); }

  .sub-h { font-size: 1.1rem; margin: 22px 0 0; }
  .shop { background: var(--surface); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
  .shop .shop-name { font-weight: 800; }
  .shop .shop-meta { color: var(--muted); font-size: 0.85rem; }
  .shop .bar { height: 6px; border-radius: 3px; background: var(--line); margin: 8px 0; overflow: hidden; }
  .shop .bar span { display: block; height: 100%; background: var(--ink); }
  .shop-links { display: flex; gap: 12px; flex-wrap: wrap; font-size: 0.9rem; font-weight: 700; }
  .shop-links a { color: var(--ink); }
  .where { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
  .cart .list-item { grid-template-columns: 64px 1fr auto; }
  .cart .list-item .sw { height: 52px; }
  .remove { font: inherit; font-size: 0.8rem; color: var(--muted); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
  .shop-opt { display: grid; grid-template-columns: 24px 1fr; gap: 12px; align-items: start; background: var(--surface);
              border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; cursor: pointer; }
  .shop-opt:has(input:checked) { border-color: var(--ink); }
  .shop-opt .shop-meta { color: var(--muted); font-size: 0.85rem; margin-top: 2px; }
  #coTotals .order-line { padding: 6px 0; }
  .shop-opt input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--ink); }
  .stock-ok { color: var(--ok); font-weight: 700; font-size: 0.85rem; }
  .stock-part { color: var(--muted); font-weight: 700; font-size: 0.85rem; }
  .unavail { opacity: 0.45; }
  .unavail-tag { font-size: 0.75rem; font-weight: 700; color: var(--muted); }
  .shop-group { margin-bottom: 26px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
  .shop-group .cart-total { margin: 12px 0 10px; }
  .cart-bar { position: sticky; bottom: 0; background: var(--bg); padding: 14px 0 6px; margin-top: 12px;
              border-top: 1px solid var(--line); }
  .cart-total { font-weight: 700; margin-bottom: 10px; }
  .cart-total small { display: block; font-weight: 400; color: var(--muted); }
  .buy { width: 100%; font-size: 1.05rem; }
  .buy:disabled { opacity: 0.4; cursor: not-allowed; }
  .cart-actions { display: flex; gap: 18px; justify-content: center; margin-top: 10px; }
  .link-btn { font: inherit; font-size: 0.9rem; font-weight: 700; color: var(--ink); background: none; border: 0; text-decoration: underline; cursor: pointer; padding: 4px; }
  .consent { color: var(--ink); align-items: flex-start; }
  .consent input { margin-top: 2px; flex: none; }
  .code-box { background: var(--surface); border: 2px solid var(--ink); border-radius: 14px; padding: 12px 14px; margin: 12px 0;
              display: flex; justify-content: space-between; align-items: center; font-weight: 700; }
  .code-box b { font-stretch: 125%; font-weight: 900; font-size: 1.8rem; letter-spacing: 0.03em; }
  .my-order { background: var(--surface); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
  .design-head { display: flex; align-items: center; gap: 10px; margin: 14px 0 6px; font-size: 0.95rem; }
  .design-head img { width: 40px; height: 40px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); background: #fff; }
  .past-orders { border-top: 1px solid var(--line); margin-top: 22px; padding-top: 6px; }
  .active-order { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer;
    background: var(--surface); border: 2px solid var(--ink); border-radius: 14px; padding: 12px 14px; margin: 0 0 10px; }
  .active-order.ready { background: var(--ink); color: var(--bg); }
  .active-order .ao-main { flex: 1; min-width: 0; }
  .active-order .ao-main b { display: block; }
  .active-order .ao-sub { font-size: 0.85rem; opacity: 0.85; }
  .active-order .ao-code { font-size: 1.5rem; font-weight: 900; letter-spacing: 0.06em; }
  .my-order .row-actions { margin-top: 6px; }
  .back-btn { font: inherit; font-weight: 700; font-size: 0.95rem; background: none; border: 0; color: var(--ink);
              padding: 6px 2px; margin: 0 0 4px -2px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
  .back-btn span:first-child { font-size: 1.6rem; line-height: 0.8; }
  .welcome { z-index: 45; }
  /* Inside a shop's website: no city choice, no other shops, no Kromatch orders or account */
  html.embed #homeCity, html.embed #locChange, html.embed #locSuggest, html.embed #openSettings,
  html.embed #activeOrders, html.embed #myOrders { display: none !important; }
  .widget-res { border: 1px solid var(--line, #ddd); border-radius: 12px; padding: 12px 14px; margin: 0 0 14px; }
  .widget-res p { margin: 0 0 8px; }
  .widget-res .primary { margin-top: 4px; }
  .powered { text-align: center; font-size: 0.8rem; color: var(--muted); margin: 14px 0 0; }
  .powered a { color: inherit; }
  #orderDetail { z-index: 32; }
  #shopSheet { z-index: 34; padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
  .od-steps { list-style: none; padding: 0; margin: 16px 0; display: grid; gap: 0; }
  .od-steps li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; padding-bottom: 14px; position: relative; }
  .od-steps li::before { content: ''; position: absolute; left: 13px; top: 24px; bottom: 0; width: 2px; background: var(--line); }
  .od-steps li:last-child::before { display: none; }
  .od-dot { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center;
            font-weight: 900; font-size: 0.85rem; background: var(--bg); position: relative; z-index: 1; }
  .od-steps li.done .od-dot { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .od-steps li.bad .od-dot { background: #B3261E; border-color: #B3261E; color: #fff; }
  .od-steps li.now b { text-decoration: underline; text-underline-offset: 3px; }
  .od-steps small { display: block; color: var(--muted); }

<script>
/* ---------- Colour maths ---------- */

function hexToRgb(hex) {
  const h = hex.replace('#', '');
  return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
}
function rgbToHex(r, g, b) {
  return '#' + [r, g, b].map(v => Math.round(v).toString(16).padStart(2, '0')).join('').toUpperCase();
}
// sRGB (0-255) -> CIE Lab (D65)
function rgbToLab(r, g, b) {
  const lin = c => { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
  const R = lin(r), G = lin(g), B = lin(b);
  const X = (0.4124564 * R + 0.3575761 * G + 0.1804375 * B) / 0.95047;
  const Y = (0.2126729 * R + 0.7151522 * G + 0.0721750 * B) / 1.0;
  const Z = (0.0193339 * R + 0.1191920 * G + 0.9503041 * B) / 1.08883;
  const f = t => t > 216 / 24389 ? Math.cbrt(t) : (24389 / 27 * t + 16) / 116;
  const fx = f(X), fy = f(Y), fz = f(Z);
  return [116 * fy - 16, 500 * (fx - fy), 200 * (fy - fz)];
}
// CIEDE2000 colour difference
function deltaE2000(lab1, lab2) {
  const [L1, a1, b1] = lab1, [L2, a2, b2] = lab2;
  const rad = Math.PI / 180, deg = 180 / Math.PI;
  const C1 = Math.hypot(a1, b1), C2 = Math.hypot(a2, b2);
  const Cbar = (C1 + C2) / 2;
  const G = 0.5 * (1 - Math.sqrt(Math.pow(Cbar, 7) / (Math.pow(Cbar, 7) + Math.pow(25, 7))));
  const a1p = (1 + G) * a1, a2p = (1 + G) * a2;
  const C1p = Math.hypot(a1p, b1), C2p = Math.hypot(a2p, b2);
  const hp = (b, a) => { if (b === 0 && a === 0) return 0; const h = Math.atan2(b, a) * deg; return h < 0 ? h + 360 : h; };
  const h1p = hp(b1, a1p), h2p = hp(b2, a2p);
  const dLp = L2 - L1, dCp = C2p - C1p;
  let dhp = 0;
  if (C1p * C2p !== 0) {
    dhp = h2p - h1p;
    if (dhp > 180) dhp -= 360; else if (dhp < -180) dhp += 360;
  }
  const dHp = 2 * Math.sqrt(C1p * C2p) * Math.sin(dhp * rad / 2);
  const Lbp = (L1 + L2) / 2, Cbp = (C1p + C2p) / 2;
  let hbp = h1p + h2p;
  if (C1p * C2p !== 0) {
    if (Math.abs(h1p - h2p) > 180) hbp += (hbp < 360 ? 360 : -360);
    hbp /= 2;
  }
  const T = 1 - 0.17 * Math.cos((hbp - 30) * rad) + 0.24 * Math.cos(2 * hbp * rad)
          + 0.32 * Math.cos((3 * hbp + 6) * rad) - 0.20 * Math.cos((4 * hbp - 63) * rad);
  const dTheta = 30 * Math.exp(-Math.pow((hbp - 275) / 25, 2));
  const Rc = 2 * Math.sqrt(Math.pow(Cbp, 7) / (Math.pow(Cbp, 7) + Math.pow(25, 7)));
  const Sl = 1 + (0.015 * Math.pow(Lbp - 50, 2)) / Math.sqrt(20 + Math.pow(Lbp - 50, 2));
  const Sc = 1 + 0.045 * Cbp, Sh = 1 + 0.015 * Cbp * T;
  const Rt = -Math.sin(2 * dTheta * rad) * Rc;
  return Math.sqrt(Math.pow(dLp / Sl, 2) + Math.pow(dCp / Sc, 2) + Math.pow(dHp / Sh, 2)
                   + Rt * (dCp / Sc) * (dHp / Sh));
}

// Apply white balance (per-channel gains in linear light) to the whole photo

    const luts = gains.map(g => { const l = new Uint8ClampedArray(256); for (let v = 0; v < 256; v++) l[v] = toSrgb(toLin(v) * g); return l; });
    shownData = new ImageData(new Uint8ClampedArray(originalData.data), originalData.width, originalData.height);
    const d = shownData.data;
    for (let i = 0; i < d.length; i += 4) { d[i] = luts[0][d[i]]; d[i + 1] = luts[1][d[i + 1]]; d[i + 2] = luts[2][d[i + 2]]; }

}
const srcCanvas = document.createElement('canvas'), srcCtx = srcCanvas.getContext('2d');
function draw() {

// Average a small square so one noisy pixel doesn't decide the colour
// Small sample area: about 9 x 9 pixels on a full-size photo
const sampleHalf = w => Math.max(2, Math.round(w / 400));
// Picks the colour under the centre of the marker. It averages a small area to remove camera
// noise, but only uses pixels that look like the centre, so a nearby second colour isn't blended in.
function averageAt(data, x, y) {
  const W = data.width, H = data.height, d = data.data;
  const cx = Math.round(x), cy = Math.round(y);
  const px = (xx, yy) => (Math.min(H - 1, Math.max(0, yy)) * W + Math.min(W - 1, Math.max(0, xx))) * 4;
  // Reference: the centre 3 x 3 pixels
  let r0 = 0, g0 = 0, b0 = 0;
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) { const i = px(cx + dx, cy + dy); r0 += d[i]; g0 += d[i + 1]; b0 += d[i + 2]; }
  r0 /= 9; g0 /= 9; b0 /= 9;
  const half = sampleHalf(W), LIMIT = 36 * 36;
  let r = 0, g = 0, b = 0, n = 0;
  for (let dy = -half; dy <= half; dy++) for (let dx = -half; dx <= half; dx++) {
    const i = px(cx + dx, cy + dy);
    const dr = d[i] - r0, dg = d[i + 1] - g0, db = d[i + 2] - b0;
    if (dr * dr + dg * dg + db * db <= LIMIT) { r += d[i]; g += d[i + 1]; b += d[i + 2]; n++; }
  }

}


function pickAt(x, y) {

function canvasPoint(e) {

function showLoupe(e, pt) {

  lctx.fillStyle = '#808080'; lctx.fillRect(0, 0, L, L);

function colourFamily(lab) {
  const [L, a, b] = lab; const C = Math.hypot(a, b); let h = Math.atan2(b, a) * 180 / Math.PI; if (h < 0) h += 360;
  const light = L < 35 ? 'dark' : L < 70 ? 'mid' : 'light';
  if (C < 10) return { family: L < 20 ? 'black' : L > 90 ? 'white' : 'grey', light };
  // Hue boundaries measured on real paint colours in Lab space
  let fam = h >= 340 || h < 20 ? 'pink' : h < 50 ? 'red' : h < 78 ? 'orange' : h < 105 ? 'yellow' : h < 170 ? 'green' : h < 225 ? 'teal' : h < 295 ? 'blue' : 'purple';
  if (h >= 40 && h < 100 && C < 45 && L < 70) fam = 'brown';
  if (fam === 'pink' && L < 40) fam = 'red';
  return { family: fam, light };
}

function distKm(a1, o1, a2, o2) {
  const r = Math.PI / 180, dA = (a2 - a1) * r, dO = (o2 - o1) * r;
  const h = Math.sin(dA / 2) ** 2 + Math.cos(a1 * r) * Math.cos(a2 * r) * Math.sin(dO / 2) ** 2;

}

    const la = pos.coords.latitude, lo = pos.coords.longitude;   // used here only, never stored
    let best = null, bd = Infinity;
    CITIES.filter(c => cityOn(c.key)).forEach(c => { const d = distKm(la, lo, c.lat, c.lng); if (d < bd) { bd = d; best = c; } });
    if (best && bd <= 150) { store.city = best.key; $('locMsg').textContent = t('locNear').replace('{city}', cityName(best.key)); }
    else { store.city = ''; $('locMsg').textContent = t('locFar'); }
    store.cityAuto = false; save(); renderSettings(); updateLocBar(); if (lastSample) showResults();
  }, () => { $('locMsg').textContent = t('locDenied'); }, { enableHighAccuracy: false, timeout: 10000, maximumAge: 600000 });
});

/* ---------- Start ---------- */
let pendingSuggest = '';
if (!store.setupDone) {
  // First visit: no setup screens. Language comes from the phone, city from its time zone.
  store.city = store.city || tzCity; store.cityAuto = true; store.setupDone = true; save();
} else if (tzCity && tzCity !== store.city && store.dismissTz !== tzCity) {
  if (store.cityAuto || !store.city) { store.city = tzCity; store.cityAuto = true; save(); }  // follows people who travel
  else pendingSuggest = tzCity;                                                              // they chose a city: ask first
}
$('setup').hidden = true;
applyLang();
updateLocBar();
if (pendingSuggest) showSuggest(pendingSuggest);
// Keep prices and stock fresh without reopening the app
let lastRefresh = 0, refreshing = false;
async function refreshLive(force) {
  if (refreshing || (!force && Date.now() - lastRefresh < 30000)) return;
  refreshing = true;
  const before = JSON.stringify(store.shopsCache || null);
  const wasLocked = !!lockedShop;
  const ok = await loadLiveShops(); updateLocBar();
  if (!wasLocked && lockedShop) { if (lastSample) showResults(); rematchDesign(); renderListCount(); }
  refreshing = false; lastRefresh = Date.now();
  if (!ok || (!force && JSON.stringify(store.shopsCache || null) === before)) return;   // nothing changed
  if (lastSample && !$('results').hidden) showResults();
  if (!$('designSheet').hidden && typeof clusters !== 'undefined' && clusters.length) {
    if (typeof codesMode !== 'undefined' && codesMode) runCodes(clusters.map(c => c.hex)); else runDesign();
  }
  if (!$('listSheet').hidden) renderList();
  renderListCount();
}
refreshLive(true).then(renderFavs).then(loadWidget);
renderFavs();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  refreshLive(false);
  // also check for a newer version of the app itself
  if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(() => {});
});
setInterval(() => { if (document.visibilityState === 'visible') refreshLive(true); }, 120000);
// Opening a link while the app is already open (e.g. tapping a notification) re-runs the links below
window.addEventListener('hashchange', () => { if (/^#(order|collected)-/.test(location.hash)) location.reload(); });
// Link from an email: "Did you collect?"  #collected-<id>-<token>-yes|no
(() => {
  const m = location.hash.match(/^#collected-([0-9a-f-]{36})-([0-9a-f-]{36})-(yes|no)$/i);
  if (!m) return;
  history.replaceState(null, '', location.pathname);
  store.orders = store.orders || [];
  let o = store.orders.find(x => x.id === m[1]);
  if (!o) { o = { id: m[1], token: m[2], no: '…', code: '…', shop: '', status: 'picked_up' }; store.orders.unshift(o); }
  o.token = m[2]; save();
  openOrderDetail(o);
  answerCollected(o, m[3].toLowerCase());
})();
// Link from a confirmation email: #order-<id>-<token>
(() => {
  const m = location.hash.match(/^#order-([0-9a-f-]{36})-([0-9a-f-]{36})$/i);
  if (!m) return;
  store.orders = store.orders || [];
  if (!store.orders.some(o => o.id === m[1])) store.orders.unshift({ id: m[1], token: m[2], no: '…', code: '…', shop: '', status: 'new' });
  save(); history.replaceState(null, '', location.pathname);
  $('openList').click();
  setTimeout(() => openOrderDetail(store.orders.find(x => x.id === m[1])), 0);
  fetch(`${CFG.functionsUrl}/get-order`, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: CFG.supabaseKey },
    body: JSON.stringify({ order_id: m[1], token: m[2] }) }).then(r => r.json()).then(j => {
      if (!j.ok) return; const o = store.orders.find(x => x.id === m[1]);
      Object.assign(o, { no: j.order.order_no, code: j.order.pickup_code, shop: j.order.shops?.name || '', status: j.order.status });
      save(); renderMyOrders(); }).catch(() => {});
})();

/* ---------- Back navigation (on-screen Back button and the phone's back gesture) ---------- */
const NAV_SHEETS = ['designSheet', 'listSheet', 'settingsSheet', 'accountSheet', 'orderSheet', 'orderDetail', 'shopSheet', 'setup'];
let navRestoring = false, navTimer = null, navIgnorePop = false;
const TAB_SHEETS = ['designSheet', 'listSheet', 'settingsSheet'];
const isTabLevel = l => l.length === 1 && TAB_SHEETS.includes(l[0]);
const navSnap = () => NAV_SHEETS.filter(id => !$(id).hidden);
function navApply(list) {
  navRestoring = true;
  NAV_SHEETS.forEach(id => { $(id).hidden = !list.includes(id); });
  setTab(list.includes('listSheet') ? 'openList' : list.includes('settingsSheet') ? 'openSettings' : list.includes('designSheet') ? 'openDesign' : 'tabMatch');
  if (list.includes('listSheet')) renderList();
  if (list.includes('settingsSheet')) renderSettings();
  if (!list.length && lastSample) showResults();
  renderListCount();
  setTimeout(() => { navRestoring = false; }, 0);
}
function navBack() {
  const st = history.state || {};
  if ((st.depth || 0) > 0) history.back(); else navApply([]);
}
history.replaceState({ nav: navSnap(), depth: 0 }, '');
const navObserver = new MutationObserver(() => {
  updateGoCart();
  if (navRestoring) return;
  clearTimeout(navTimer);
  navTimer = setTimeout(() => {
    const cur = navSnap(), st = history.state || {}, prev = st.nav || [];
    if (JSON.stringify(cur) === JSON.stringify(prev)) return;
    // one tab to another: swap the entry, so Back goes Home instead of through every tab you visited
    if (isTabLevel(prev) && isTabLevel(cur)) { history.replaceState({ nav: cur, depth: st.depth || 0, tab: true }, ''); return; }
    // from a tab straight back Home: step back instead of adding an entry (so Back on Home leaves the app as expected)
    if (!cur.length && st.tab && (st.depth || 0) === 1) { navIgnorePop = true; history.back(); return; }
    history.pushState({ nav: cur, depth: (st.depth || 0) + 1, tab: !prev.length && isTabLevel(cur) }, '');
  }, 0);
});
NAV_SHEETS.forEach(id => navObserver.observe($(id), { attributes: true, attributeFilter: ['hidden'] }));
window.addEventListener('popstate', e => { if (navIgnorePop) { navIgnorePop = false; return; } navApply((e.state && e.state.nav) || []); });
document.querySelectorAll('[data-back]').forEach(b => b.addEventListener('click', navBack));
</script>
<script>
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    // Reload once when an updated version takes over (not on the very first install)
    const hadController = !!navigator.serviceWorker.controller;
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !reloaded) { reloaded = true; location.reload(); } });
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then(r => r.update()).catch(() => {});
    });
  }
</script>
